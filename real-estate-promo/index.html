<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #FBF4EA;
      }
      body {
        font-family: "Noto Sans CJK TC", "Noto Sans TC", sans-serif;
        color: #243240;
        -webkit-font-smoothing: antialiased;
      }

      /* ---- warm optimistic backdrop (radial glow, no banding) ---- */
      #bg { position: absolute; inset: 0;
        background: radial-gradient(1200px 1200px at 50% 18%, #FFFDF8 0%, #FBF4EA 46%, #F3E7D3 100%);
      }
      .blob { position: absolute; border-radius: 50%; filter: blur(2px); opacity: 0.5; }
      #blobA { width: 460px; height: 460px; left: -150px; top: -120px;
        background: radial-gradient(circle at 35% 35%, #FBD7A6, transparent 70%); }
      #blobB { width: 560px; height: 560px; right: -200px; bottom: -160px;
        background: radial-gradient(circle at 60% 40%, #BFE6D7, transparent 70%); }

      /* ---- scenes ---- */
      .scene { position: absolute; inset: 0; }
      .scene-inner {
        position: absolute; inset: 0;
        display: flex; flex-direction: column; justify-content: center;
        align-items: center; text-align: center;
        width: 100%; height: 100%;
        padding: 200px 110px; gap: 30px; box-sizing: border-box;
      }

      .kicker { font-size: 46px; font-weight: 700; letter-spacing: 6px; color: #1C8C73; }
      .pill { display: inline-block; font-size: 40px; font-weight: 700; letter-spacing: 4px;
        color: #B85B1E; background: #FBE4CC; border-radius: 999px; padding: 16px 40px; }
      .hero { font-size: 130px; font-weight: 900; line-height: 1.18; letter-spacing: 2px; color: #243240; }
      .hero.smaller { font-size: 104px; }
      .sub { font-size: 52px; font-weight: 700; line-height: 1.5; color: #4B5A66; max-width: 760px; }
      .accent { color: #EF8A3C; }
      .teal { color: #1C8C73; }

      /* highlight words row (更大 · 更好 · 更划算) */
      .triple { display: flex; gap: 26px; flex-wrap: wrap; justify-content: center; }
      .word { font-size: 112px; font-weight: 900; color: #fff; background: #EF8A3C;
        border-radius: 26px; padding: 12px 36px; box-shadow: 0 16px 40px rgba(239,138,60,0.35); }
      .word.w2 { background: #1C8C73; box-shadow: 0 16px 40px rgba(28,140,115,0.35); }
      .word.w3 { background: #243240; box-shadow: 0 16px 40px rgba(36,50,64,0.35); }

      /* marker underline for 價格優勢看得見 */
      .markwrap { position: relative; display: inline-block; }
      .marker { position: absolute; left: -10px; right: -10px; bottom: 10px; height: 34px;
        background: #FBD7A6; border-radius: 8px; z-index: -1; transform-origin: left center; }

      /* CTA */
      .cta-card { background: #243240; color: #fff; border-radius: 44px; padding: 70px 70px 76px;
        display: flex; flex-direction: column; align-items: center; gap: 26px;
        box-shadow: 0 30px 70px rgba(36,50,64,0.30); max-width: 820px; }
      .cta-big { font-size: 150px; font-weight: 900; letter-spacing: 4px; }
      .cta-sub { font-size: 56px; font-weight: 700; color: #FBD7A6; }
      .cta-btn { margin-top: 14px; font-size: 50px; font-weight: 900; letter-spacing: 3px;
        color: #243240; background: #EF8A3C; border-radius: 999px; padding: 26px 60px; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="18"
      data-width="1080"
      data-height="1920"
    >
      <div id="bg">
        <div class="blob" id="blobA"></div>
        <div class="blob" id="blobB"></div>
      </div>

      <!-- ===== Scene 1 : Hook ===== -->
      <div class="scene clip" id="s1" data-start="0" data-duration="4.4" data-track-index="0" style="z-index:1">
        <div class="scene-inner" id="s1in">
          <div class="kicker" id="s1k">給每天打拼的上班族</div>
          <div class="hero smaller" id="s1h">上班這麼拼，<br />是時候有一間<br /><span class="accent">自己的房</span>了</div>
        </div>
      </div>

      <!-- ===== Scene 2 : 更大 更好 更划算 ===== -->
      <div class="scene clip" id="s2" data-start="4.0" data-duration="5.2" data-track-index="1" style="z-index:2">
        <div class="scene-inner" id="s2in">
          <div class="pill" id="s2p">一樣的預算</div>
          <div class="triple" id="s2t">
            <span class="word w1">更大</span>
            <span class="word w2">更好</span>
            <span class="word w3">更划算</span>
          </div>
          <div class="sub" id="s2s">我幫你買到更值得的房子</div>
        </div>
      </div>

      <!-- ===== Scene 3 : 價格優勢 ===== -->
      <div class="scene clip" id="s3" data-start="8.8" data-duration="4.4" data-track-index="2" style="z-index:3">
        <div class="scene-inner" id="s3in">
          <div class="hero" id="s3h" style="font-size:120px">
            <span class="markwrap">價格優勢<br />看得見<span class="marker" id="s3m"></span></span>
          </div>
          <div class="sub" id="s3s">沒有話術，<span class="teal">只有實在數字</span></div>
        </div>
      </div>

      <!-- ===== Scene 4 : CTA ===== -->
      <div class="scene clip" id="s4" data-start="12.8" data-duration="5.2" data-track-index="3" style="z-index:4">
        <div class="scene-inner" id="s4in">
          <div class="kicker" id="s4k" style="color:#B85B1E">心動了嗎？</div>
          <div class="cta-card" id="s4card">
            <div class="cta-big">私訊我</div>
            <div class="cta-sub">今天就帶你看屋</div>
            <div class="cta-btn">私訊洽詢 →</div>
          </div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });

        /* slow ambient drift on backdrop blobs */
        tl.to("#blobA", { x: 40, y: 30, duration: 18, ease: "sine.inOut" }, 0);
        tl.to("#blobB", { x: -50, y: -30, duration: 18, ease: "sine.inOut" }, 0);

        /* ----- Scene 1 (0 - 4.4) ----- */
        tl.from("#s1in", { opacity: 0, duration: 0.5, ease: "power1.out" }, 0.1);
        tl.from("#s1k", { y: 40, opacity: 0, duration: 0.6, ease: "power3.out" }, 0.2);
        tl.from("#s1h", { y: 70, opacity: 0, duration: 0.8, ease: "power4.out" }, 0.5);

        /* ----- Scene 2 (4.0 - 9.2) ----- */
        tl.from("#s2in", { opacity: 0, duration: 0.5, ease: "power1.out" }, 4.0);
        tl.from("#s2p", { y: -30, opacity: 0, duration: 0.5, ease: "back.out(1.6)" }, 4.2);
        tl.from("#s2t .word", { y: 90, opacity: 0, scale: 0.6, duration: 0.55, ease: "back.out(1.8)", stagger: 0.16 }, 4.6);
        tl.from("#s2s", { y: 36, opacity: 0, duration: 0.5, ease: "power2.out" }, 5.7);
        tl.to("#s2t .word", { scale: 1.06, duration: 0.18, yoyo: true, repeat: 1, ease: "sine.inOut", stagger: 0.16 }, 6.4);

        /* ----- Scene 3 (8.8 - 13.2) ----- */
        tl.from("#s3in", { opacity: 0, duration: 0.5, ease: "power1.out" }, 8.8);
        tl.from("#s3h", { y: 60, opacity: 0, duration: 0.7, ease: "power4.out" }, 9.0);
        tl.from("#s3m", { scaleX: 0, duration: 0.6, ease: "power2.inOut" }, 9.7);
        tl.from("#s3s", { y: 34, opacity: 0, duration: 0.55, ease: "power2.out" }, 10.1);

        /* ----- Scene 4 (12.8 - 18.0) CTA ----- */
        tl.from("#s4in", { opacity: 0, duration: 0.5, ease: "power1.out" }, 12.8);
        tl.from("#s4k", { y: 30, opacity: 0, duration: 0.5, ease: "power3.out" }, 13.0);
        tl.from("#s4card", { y: 90, opacity: 0, scale: 0.9, duration: 0.7, ease: "back.out(1.5)" }, 13.3);
        tl.from(".cta-btn", { scale: 0.7, opacity: 0, duration: 0.5, ease: "back.out(2)" }, 14.0);
        tl.to(".cta-btn", { scale: 1.05, duration: 0.4, yoyo: true, repeat: 3, ease: "sine.inOut" }, 14.7);

        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      </script>
    </div>
  </body>
</html>
