<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>實價AI｜實價登錄成交行情分析</title>
<style>
  :root {
    --green-dark: #1F3A2E;
    --green: #2C4E3D;
    --gold: #D8BC7E;
    --cream: #FAF7EF;
    --paper: #F3EEE2;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--cream);
    display: flex; flex-direction: column;
    height: 100dvh;
  }
  header {
    background: var(--green-dark);
    color: var(--cream);
    padding: 14px 20px;
    display: flex; align-items: center; gap: 12px;
    box-shadow: 0 2px 8px rgba(31,58,46,.25);
  }
  header .logo {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--gold); color: var(--green-dark);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 18px;
  }
  header h1 { font-size: 18px; font-weight: 700; letter-spacing: 1px; }
  header p { font-size: 12px; opacity: .75; }

  #chat {
    flex: 1; overflow-y: auto;
    padding: 20px 16px 8px;
    max-width: 760px; width: 100%; margin: 0 auto;
  }
  .msg { display: flex; margin-bottom: 14px; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: 85%;
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 15px; line-height: 1.75;
    white-space: pre-wrap; word-break: break-word;
  }
  .user .bubble {
    background: var(--green);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .ai .bubble {
    background: #fff;
    color: #2a2a2a;
    border: 1px solid #e5dfd0;
    border-bottom-left-radius: 4px;
    box-shadow: 0 1px 3px rgba(0,0,0,.05);
  }
  .ai .bubble table { border-collapse: collapse; margin: 6px 0; font-size: 13px; }
  .ai .bubble td, .ai .bubble th { border: 1px solid #ddd; padding: 4px 8px; }

  .typing { display: inline-flex; gap: 5px; padding: 4px 2px; }
  .typing span {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--gold);
    animation: blink 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100% { opacity:.25 } 40% { opacity:1 } }

  #quick {
    max-width: 760px; width: 100%; margin: 0 auto;
    padding: 0 16px 8px;
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  #quick button {
    background: #fff; border: 1px solid var(--gold);
    color: var(--green-dark);
    border-radius: 999px; padding: 7px 14px;
    font-size: 13px; cursor: pointer;
    transition: background .15s;
  }
  #quick button:hover { background: var(--paper); }

  form {
    background: #fff;
    border-top: 1px solid #e5dfd0;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  }
  .inputRow {
    max-width: 760px; margin: 0 auto;
    display: flex; gap: 10px;
  }
  #input {
    flex: 1; border: 1.5px solid #d8d2c2; border-radius: 12px;
    padding: 12px 14px; font-size: 15px; outline: none;
    font-family: inherit; resize: none;
  }
  #input:focus { border-color: var(--green); }
  #send {
    background: var(--green-dark); color: var(--gold);
    border: none; border-radius: 12px;
    padding: 0 22px; font-size: 15px; font-weight: 700;
    cursor: pointer; letter-spacing: 2px;
  }
  #send:disabled { opacity: .5; cursor: not-allowed; }
  .disclaimer {
    max-width: 760px; margin: 8px auto 0;
    font-size: 11px; color: #999; text-align: center;
  }
</style>
</head>
<body>
<header>
  <div class="logo">實</div>
  <div>
    <h1>實價AI</h1>
    <p>內政部實價登錄 × Claude 行情分析</p>
  </div>
</header>

<div id="chat">
  <div class="msg ai"><div class="bubble">你好！我是「實價AI」🏠
我可以幫你查詢與分析全台的實價登錄成交行情，例如：
・某個行政區最近的成交均價、每坪單價
・不同區域行情比較
・預售屋、中古屋、租金行情
・特定路段或價格帶的成交案例

想查哪裡的行情呢？</div></div>
</div>

<div id="quick">
  <button>台中市北屯區最近的成交行情？</button>
  <button>西屯區七期住宅大樓每坪多少？</button>
  <button>烏日區 1500 萬以下的成交案例</button>
  <button>比較北屯區和太平區的房價</button>
  <button>台中市預售屋最新行情</button>
</div>

<form id="form">
  <div class="inputRow">
    <textarea id="input" rows="1" placeholder="輸入你想查的行情，例如：南屯區透天最近成交價"></textarea>
    <button id="send" type="submit">送出</button>
  </div>
  <div class="disclaimer">資料來源：內政部實價登錄開放資料，僅供參考，實際成交以個案為準。</div>
</form>

<script>
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");
const quick = document.getElementById("quick");
const history = [];

function addBubble(role, text) {
  const msg = document.createElement("div");
  msg.className = "msg " + (role === "user" ? "user" : "ai");
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;
  msg.appendChild(bubble);
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
  return bubble;
}

function addTyping() {
  const msg = document.createElement("div");
  msg.className = "msg ai";
  msg.innerHTML = '<div class="bubble"><div class="typing"><span></span><span></span><span></span></div>　查詢實價登錄中…</div>';
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
  return msg;
}

async function ask(text) {
  if (!text.trim()) return;
  addBubble("user", text);
  history.push({ role: "user", content: text });
  input.value = "";
  send.disabled = true;
  const typing = addTyping();

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history }),
    });
    const data = await res.json();
    typing.remove();
    if (data.reply) {
      addBubble("ai", data.reply);
      history.push({ role: "assistant", content: data.reply });
    } else {
      addBubble("ai", "❌ " + (data.error || "發生錯誤，請再試一次。"));
    }
  } catch (e) {
    typing.remove();
    addBubble("ai", "❌ 連線失敗：" + e.message);
  } finally {
    send.disabled = false;
    input.focus();
  }
}

form.addEventListener("submit", (e) => { e.preventDefault(); ask(input.value); });
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(input.value); }
});
quick.addEventListener("click", (e) => {
  if (e.target.tagName === "BUTTON") ask(e.target.textContent);
});
</script>
</body>
</html>
