<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<style>
@font-face{font-family:'NSerif';src:url('NotoSerifTC-700.ttf');font-weight:700}
@font-face{font-family:'NSans';src:url('NotoSansTC-500.ttf');font-weight:500}
:root{--forest:#1F3A2E;--brass:#B08D3F;--brass-lite:#D8BC7E;--cream:#F3EEE2}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1080px;background:var(--forest);color:var(--cream);
     font-family:'NSans',sans-serif;padding:66px 80px;display:flex;flex-direction:column}
.eyebrow{font-size:23px;letter-spacing:.22em;color:var(--brass-lite);font-weight:500}
.rule{width:62px;height:3px;background:var(--brass);margin:24px 0 28px}
h1{font-family:'NSerif';font-weight:700;font-size:74px;line-height:1.24}
h1 em{font-style:normal;color:var(--brass-lite)}
.sub{margin-top:20px;font-size:26px;line-height:1.6;color:#cfd8cd}
.chart{margin-top:34px}
.lbl{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.nm{font-size:27px;font-weight:500}
.pv{font-family:'NSerif';font-weight:700;font-size:27px;color:var(--brass-lite)}
.bar{height:13px;border-radius:99px;background:var(--brass);margin-bottom:19px}
.other{margin-top:4px;padding-top:20px;border-top:1px solid rgba(216,188,126,.22);
       font-size:25px;color:#a8b6ab}
.foot{margin-top:auto;border-top:1px solid rgba(216,188,126,.3);padding-top:24px;
      display:flex;justify-content:space-between;align-items:flex-end}
.slogan{font-family:'NSerif';font-weight:700;font-size:33px;color:var(--brass-lite)}
.url{font-size:29px;letter-spacing:.04em;font-weight:500}
.note{font-size:18px;color:#8fa295;margin-top:7px;line-height:1.5}
</style></head><body>
<div class="eyebrow">SIXHANDS STUDIO ・ 台中十三期</div>
<div class="rule"></div>
<h1>還有 <em>11.34 公頃</em><br>已請照　還沒推</h1>
<div class="sub">40 筆土地、34,302 坪，約 16 個足球場大。<br>誰手上壓著最多：</div>

<div class="chart">
  <div class="lbl"><span class="nm">寶佳</span><span class="pv">5,694 坪</span></div>
  <div class="bar" style="width:100%"></div>
  <div class="lbl"><span class="nm">惠宇</span><span class="pv">5,084 坪</span></div>
  <div class="bar" style="width:89.3%"></div>
  <div class="lbl"><span class="nm">鉅虹建設</span><span class="pv">4,794 坪</span></div>
  <div class="bar" style="width:84.2%"></div>
  <div class="lbl"><span class="nm">大陸建設</span><span class="pv">1,707 坪</span></div>
  <div class="bar" style="width:30.0%"></div>
  <div class="lbl"><span class="nm">豐邑建設</span><span class="pv">1,609 坪</span></div>
  <div class="bar" style="width:28.3%"></div>
  <div class="other">其餘 19 家合計 13,873 坪（40.4%）　｜　<b style="color:var(--brass-lite)">前三大就佔 45.4%</b></div>
</div>

<div class="foot">
  <div><div class="slogan">不賣房子，賣判斷。</div>
       <div class="note">資料：正心「公辦市地重劃十三期成交地圖」第伍版（115/01）圖面標註，非實價登錄<br>圖面狀態日 115/01/25，建照可能已變更或開賣</div></div>
  <div class="url">sixhands.tw</div>
</div>
</body></html>
