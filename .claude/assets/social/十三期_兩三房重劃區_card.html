<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<style>
@font-face{font-family:'NSerif';src:url('NotoSerifTC-700.ttf');font-weight:700}
@font-face{font-family:'NSans';src:url('NotoSansTC-500.ttf');font-weight:500}
:root{--forest:#1F3A2E;--brass:#B08D3F;--brass-lite:#D8BC7E;--cream:#F3EEE2}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1080px;background:var(--forest);color:var(--cream);
     font-family:'NSans',sans-serif;padding:66px 80px;display:flex;flex-direction:column}
.eyebrow{font-size:23px;letter-spacing:.22em;color:var(--brass-lite);font-weight:500}
.rule{width:62px;height:3px;background:var(--brass);margin:24px 0 28px}
h1{font-family:'NSerif';font-weight:700;font-size:74px;line-height:1.24}
h1 em{font-style:normal;color:var(--brass-lite)}
.sub{margin-top:20px;font-size:26px;line-height:1.6;color:#cfd8cd}
.waffle{margin-top:40px;display:grid;grid-template-columns:repeat(13,1fr);gap:9px}
.c{aspect-ratio:1;border-radius:8px;border:2px solid rgba(216,188,126,.35)}
.c.four{background:var(--brass);border-color:var(--brass)}
.key{margin-top:22px;display:flex;gap:40px;font-size:25px}
.key span{display:flex;align-items:center;gap:12px}
.sw{width:24px;height:24px;border-radius:5px;border:2px solid rgba(216,188,126,.35)}
.sw.four{background:var(--brass);border-color:var(--brass)}
.key b{font-family:'NSerif';color:var(--brass-lite);font-size:28px}
.names{margin-top:24px;padding-top:20px;border-top:1px solid rgba(216,188,126,.22);
       font-size:25px;line-height:1.6;color:#a8b6ab}
.names b{color:var(--cream);font-weight:500}
.foot{margin-top:auto;border-top:1px solid rgba(216,188,126,.3);padding-top:24px;
      display:flex;justify-content:space-between;align-items:flex-end}
.slogan{font-family:'NSerif';font-weight:700;font-size:33px;color:var(--brass-lite)}
.url{font-size:29px;letter-spacing:.04em;font-weight:500}
.note{font-size:18px;color:#8fa295;margin-top:7px;line-height:1.5}
</style></head><body>
<div class="eyebrow">SIXHANDS STUDIO ・ 台中十三期</div>
<div class="rule"></div>
<h1>十三期，<br>是個<em>兩三房</em>的重劃區</h1>
<div class="sub">26 個有揭露格局的大樓案，一格一案：</div>

<div class="waffle">
  <div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div>
  <div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div>
  <div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div>
  <div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div>
  <div class="c"></div><div class="c"></div>
  <div class="c four"></div><div class="c four"></div><div class="c four"></div><div class="c four"></div>
</div>
<div class="key">
  <span><i class="sw"></i>只做兩、三房　<b>22 案</b></span>
  <span><i class="sw four"></i>有四房　<b>4 案</b></span>
</div>
<div class="names">有四房的只有：<b>中陽旭月・惠宇拾山・國聚之尚・惠宇大然</b><br>
  26 案裡有 24 案，主力坪數落在 23～52 坪</div>

<div class="foot">
  <div><div class="slogan">不賣房子，賣判斷。</div>
       <div class="note">資料：正心「公辦市地重劃十三期成交地圖」第伍版（115/01）圖面標註，非實價登錄<br>圖面狀態日 115/01/25，不含透天</div></div>
  <div class="url">sixhands.tw</div>
</div>
</body></html>
